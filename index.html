<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Start</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .kiosk-wrap {
            aspect-ratio: 9 / 16;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #0b2b16;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .background-slider { position: absolute; inset: 0; z-index: 0; }
        .slide-img-1, .slide-img-2 {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        .slide-img-1.active, .slide-img-2.active { opacity: 0.35; }

        .overlay {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, rgba(11,43,22,0.5) 0%, rgba(11,43,22,0.2) 40%, rgba(11,43,22,0.8) 100%);
        }

        .content {
            position: absolute; inset: 0; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 36px; padding: 40px;
        }

        .logo-main { width: 70%; max-width: 340px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }

        .tap-text {
            color: white; font-family: Arial, sans-serif;
            font-size: 26px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.97); }
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(140, 198, 63, 0.45);
            transform: scale(0); pointer-events: none; z-index: 10;
            animation: rippleAnim 0.6s ease-out forwards;
        }
        @keyframes rippleAnim { to { transform: scale(8); opacity: 0; } }

        .brand-bar {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
            background: #8cc63f; padding: 16px 24px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-bar span { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; color: #0b2b16; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="kiosk-wrap" id="kioskWrap">
        <div class="background-slider">
            <img src="images/acai-bowl.png" class="slide-img-1 active">
            <img src="images/PB-CT.png" class="slide-img-2">
        </div>
        <div class="overlay"></div>
        <div class="content">
            <img src="images/kiosk-logo.png" alt="Logo" class="logo-main">
            <p class="tap-text">Touch screen to start</p>
        </div>
        <div class="brand-bar">
            <span>Happy Herbivore &mdash; Fresh &amp; Plant-Based</span>
        </div>
    </div>

    <script>
        // Slideshow
        const img1 = document.querySelector('.slide-img-1');
        const img2 = document.querySelector('.slide-img-2');
        let cur = 1;
        setInterval(() => {
            if (cur === 1) { img1.classList.remove('active'); img2.classList.add('active'); cur = 2; }
            else { img2.classList.remove('active'); img1.classList.add('active'); cur = 1; }
        }, 3500);

        // Tap to navigate
        document.getElementById('kioskWrap').addEventListener('click', (e) => {
            const wrap = e.currentTarget;
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const rect = wrap.getBoundingClientRect();
            const size = 80;
            ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
            wrap.appendChild(ripple);
            setTimeout(() => window.location.href = 'order-type.html', 350);
        });
    </script>
</body>
</html>
