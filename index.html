<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kiosk Start</title>
</head>
<body>

    <div class="container">
        <div class="kiosk-screen">
            <div class="background-slider">
                <img src="images/acai-bowl.png" alt="Slide 1" class="slide-img-1">
                <img src="images/PB-CT.png" alt="Slide 2" class="slide-img-2">
            </div>

            <div class="content">
                <img src="images/kiosk-logo.png" alt="Logo" class="logo-main">
                <h1>Touch screen to start</h1>
            </div>
        </div>
    </div>

</body>
</html>
