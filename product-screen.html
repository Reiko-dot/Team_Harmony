<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Herbivore POS</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <div class="app-container">
        <header class="header">
            <img src="images/dino.png" alt="Dino Mascot" class="dino-image">
            <img src="images/herbivore-title.png" alt="Happy Herbivore" class="title-image">
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <button class="category-btn active" data-category="drinks">Drinks</button>
                <button class="category-btn" data-category="breakfast">Breakfast</button>
                <button class="category-btn" data-category="lunch">Lunch &<br> Dinner</button>
                <button class="category-btn" data-category="snacks">Handhelds</button>
                <button class="category-btn" data-category="desserts">Side & <br> Small plates</button>
                <button class="category-btn" data-category="specials">Signature <br> Dips</button>
            </aside>

            <section class="product-grid" id="product-container">
                
                <div class="product-item category-drinks">
                    <img src="images/green-glow.png" alt="Green-glow">
                    <div class="product-details">
                        <span class="name">Green Glow</span>
                        <span class="price">€ 4.50</span>
                    </div>
                </div>
                <div class="product-item category-drinks">
                    <img src="images/berry-blast.png" alt="berry-blast">
                    <div class="product-details">
                        <span class="name">Berry Blast</span>
                        <span class="price">€ 3.80</span>
                    </div>
                </div>

                <div class="product-item category-drinks">
                    <img src="images/citrus-drink.png" alt="Citrus-Drink">
                    <div class="product-details">
                        <span class="name">Citrus Cooler</span>
                        <span class="price">€ 3.50</span>
                    </div>
                </div>

                <div class="product-item category-drinks">
                    <img src="images/iced-matcha.png" alt="Iced-Matcha">
                    <div class="product-details">
                        <span class="name">Iced Matcha</span>
                        <span class="price">€ 4.00</span>
                    </div>
                </div>

                <div class="product-item category-drinks">
                    <img src="images/fruit-infused.png" alt="Fruit-infused-water">
                    <div class="product-details">
                        <span class="name">Fruit-infused water</span>
                        <span class="price">€ 3.80</span>
                    </div>
                </div>

                <div class="product-item category-breakfast">
                    <img src="images/acai-bowl.png" alt="Acai">
                    <div class="product-details">
                        <span class="name">Acai Bowl</span>
                        <span class="price">€ 7.50</span>
                    </div>
                </div>

                <div class="product-item category-lunch">
                    <img src="images/PB-CT.png" alt="Tofu">
                    <div class="product-details">
                        <span class="name">Tofu Bowl</span>
                        <span class="price">€ 9.50</span>
                    </div>
                </div>

                <div class="product-item category-snacks">
                    <div class="product-placeholder"></div>
                    <div class="product-details">
                        <span class="name">Vegan Wrap</span>
                        <span class="price">€ 5.00</span>
                    </div>
                </div>

                

            </section>
        </div>

        <footer class="footer">
            <div class="button-row">
                <button class="clear-btn">CLEAR ORDER</button>
                <button class="order-btn">CART</button>
            </div>
            <div class="info-row">
                <span>Orderoverview</span>
                <span class="total-label">Total</span>
                <span class="total-price">€ 0.00</span>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>

</body>
</html>
